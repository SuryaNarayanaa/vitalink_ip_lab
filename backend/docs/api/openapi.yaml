      responses:
        "200":
          description: Trends retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationTrendsResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /statistics/compliance:
    get:
      x-required-capability: tenant.analytics.read
      x-admin-scope: tenant
      x-admin-roles: [hospital_admin]
      tags: [Statistics]
      summary: Get compliance statistics
      responses:
        "200":
          description: Compliance retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InrComplianceResponse"
