            next_of_kin:
              type: object
              properties:
                name: { type: string }
                relation: { type: string }
                relationship: { type: string }
                phone: { $ref: "#/components/schemas/PrimaryPhoneNumber" }
              additionalProperties: false
          additionalProperties: false
        hospital_id: { type: string }
        hospital: { type: string }
      additionalProperties: false
      description: Clinical fields, Doctor assignment, passwords, status, MFA, and other security fields are rejected. Use dedicated assignment, status, and credential routes.

    AdminDoctorStatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean
      additionalProperties: false

    AdminPatientStatusRequest:
      type: object
      minProperties: 1
      properties:
        is_active:
          type: boolean
        account_status:
          type: string
          enum: [Active, Discharged, Deceased]
      additionalProperties: false
      description: When both fields are supplied they must describe the same active/inactive state.

    AdminOperationalCredentialsResetRequest:
      type: object
      properties:
        new_password:
          type: string
          minLength: 8
          description: Optional replacement. When omitted, the server generates a temporary password.
      additionalProperties: false

    AdminPatientAssignmentRequest:
      type: object
      required: [doctor_id]
      properties:
        doctor_id:
          type: string
          minLength: 1
          description: Active same-hospital Doctor user ID or canonical login ID.
      additionalProperties: false

    AdminResetPasswordRequest:
      type: object
      required: [target_user_id]
      properties:
        target_user_id:
          type: string
        new_password:
          type: string
          minLength: 8

    BatchOperationRequest:
      type: object
      required: [operation, user_ids]
      properties:
        operation:
          type: string
          enum: [activate, deactivate, reset_password]
        user_ids:
          type: array
          minItems: 1
          items:
            type: string

    SystemConfig:
      type: object
      properties:
        inr_thresholds:
          type: object
          properties:
            critical_low:
              type: number
            critical_high:
              type: number
        session_timeout_minutes:
          type: integer
        rate_limit:
          type: object
          properties:
            max_requests:
              type: integer
            window_minutes:
              type: integer
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
        is_active:
          type: boolean

    SystemConfigUpdateRequest:
      type: object
      properties:
        inr_thresholds:
          type: object
          properties:
            critical_low:
              type: number
            critical_high:
              type: number
        session_timeout_minutes:
          type: integer
        rate_limit:
          type: object
          properties:
            max_requests:
              type: integer
            window_minutes:
              type: integer
        feature_flags:
          type: object
          additionalProperties:
            type: boolean

    SystemConfigResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SystemConfig"

    BroadcastNotificationRequest:
      type: object
      required: [title, message, target]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 2000
        target:
          type: string
          enum: [ALL, DOCTORS, PATIENTS, SPECIFIC]
        user_ids:
          type: array
          items:
            type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
