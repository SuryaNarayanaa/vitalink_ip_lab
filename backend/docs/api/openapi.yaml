  /webhooks/payment:
    post:
      tags: [Admin]
      summary: Payment provider settlement webhook
      security: []
      description: |
        Trusted payment-provider callback. Provider signs the full payload with
        PAYMENT_WEBHOOK_SECRET as HMAC-SHA256 over
        `session_id.invoice_number.amount.currency.provider_event_id.timestamp`
        (unix ms). Each invoice settles at most once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, invoice_number, amount, signature, provider_event_id, timestamp]
              properties:
                session_id: { type: string }
                invoice_number: { type: string }
                amount: { type: number }
                currency: { type: string, default: INR }
                signature: { type: string }
                provider_event_id: { type: string }
                timestamp:
                  type: number
                  description: Unix epoch milliseconds used in the HMAC material
      responses:
        "200":
          description: Invoice settled (or already paid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "401":
