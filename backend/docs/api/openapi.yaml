openapi: 3.1.0
info:
  title: VitaLink API
  version: 1.0.0
  summary: Versioned API contract for the VitaLink backend
  description: |
    OpenAPI specification for the currently implemented VitaLink backend.

    Notes:
    - The canonical integration base path is `/api/v1`.
    - Legacy `/api/*` routes remain available for backward compatibility but are deprecated.
    - Authentication uses revocable bearer JWT sessions with opaque refresh tokens.
    - Most application responses use `{ statusCode, message, data, success }`; authentication, rate-limit, and direct authorization-guard failures may use the compatible `{ success, message }` subset.
    - Administrative and statistics routes enforce persisted RBAC V2 capabilities. Capability names are namespaced as `platform.*` for global authority and `tenant.*` for one-hospital authority.
    - Administrator roles are fixed: `app_admin` is global and protected, `hospital_admin` is limited to one active hospital, and `auditor` is global and hard read-only. Doctor and Patient authorization is not editable through administrator role policy.
    - Versioned responses expose `X-API-Version` and `X-API-Supported-Versions`. Legacy `/api/*` responses also expose `Deprecation`, `Sunset`, and `Link` headers.
    - Patient and doctor notification streams are Server-Sent Events (SSE). Browser EventSource clients that cannot set an Authorization header must first call `POST /notifications/stream-ticket` (authenticated) and open the stream with the short-lived single-use `ticket` query parameter (not a long-lived access JWT).
    - Multipart upload endpoints accept a single form field named `file`; validation failures such as unsupported MIME type or size limit return 400, while cloud storage failures return 507.
  contact:
    name: VitaLink Engineering
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.vitalink.invalid/api/v1
    description: Production deployment placeholder
tags:
  - name: System
    description: API indexes, health checks, and version metadata.
  - name: Authentication
    description: Login, logout, session identity, and password lifecycle.
  - name: Patient
    description: Patient profile, reports, dosage, health logs, notifications, and SSE streams.
  - name: Doctor
    description: Doctor profile, patient management, report review, notifications, and SSE streams.
  - name: Admin
    description: Administrative management protected by fixed-role, persisted RBAC V2 capability and scope checks.
  - name: Statistics
    description: Administrative analytics and aggregate operational metrics.
  - name: Devices
    description: Authenticated FCM device token registration and deregistration for push delivery.
security:
  - bearerAuth: []
paths:
  /:
    get:
      tags: [System]
      summary: API version index
      security: []
      responses:
        "200":
          description: API version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndexResponse"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      description: |
        Authenticates a user by login ID and password.
        Returns a revocable session payload on success, or a 202 challenge when
        patient/doctor first-login SMS OTP or admin TOTP MFA is required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "202":
          description: Additional verification required (phone OTP or admin TOTP)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/LoginRateLimited"

  /auth/login/otp/resend:
    post:
      tags: [Authentication]
      summary: Resend login OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id]
              properties:
                challenge_id: { type: string }
      responses:
        "200":
          description: OTP resent when allowed by cooldown/policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          description: Resend cooldown active

  /auth/login/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify patient/doctor login phone OTP
      description: Completes a first-login SMS OTP challenge and returns a normal session payload.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyLoginOtpRequest"
      responses:
        "200":
          description: OTP verified; session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/LoginRateLimited"

  /auth/login/totp/verify:
    post:
      tags: [Authentication]
      summary: Verify admin login TOTP
      description: Completes an admin authenticator-app MFA challenge and returns a normal session payload.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyLoginTotpRequest"
      responses:
        "200":
          description: TOTP verified; session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/LoginRateLimited"

  /auth/admin/mfa/totp/setup:
    post:
      tags: [Authentication]
      summary: Start admin TOTP enrollment
      description: Creates a pending authenticator-app enrollment for the authenticated admin.
      responses:
        "200":
          description: Enrollment secret and otpauth URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTotpSetupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/admin/mfa/totp/status:
    get:
      tags: [Authentication]
      summary: Admin TOTP enrollment status
      description: Returns whether the authenticated admin has an active authenticator enrollment.
      responses:
        "200":
          description: TOTP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTotpStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/admin/mfa/totp/activate:
    post:
      tags: [Authentication]
      summary: Activate admin TOTP enrollment
      description: Confirms a pending authenticator-app enrollment with a valid TOTP code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAdminTotpRequest"
      responses:
        "200":
          description: Enrollment activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current user
      description: Revokes the current authenticated session.
      responses:
        "200":
          description: Logout acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh session
      description: Rotates a valid refresh token and returns a new access token and refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/revoke:
    post:
      tags: [Authentication]
      summary: Revoke session by refresh token
      description: Revokes the session associated with the submitted refresh token, if one exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change current user password
      description: Changes the authenticated user's password and revokes all active sessions for that user, including the session used for the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /patient/profile:
    get:
      tags: [Patient]
      summary: Get patient profile
      responses:
        "200":
          description: Patient profile with doctor update summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Patient]
      summary: Update patient profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientProfileUpdateRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfileUpdateResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /patient/reports:
    get:
      tags: [Patient]
      summary: Get patient reports and care data
      responses:
        "200":
          description: Patient report payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientReportsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Patient]
      summary: Submit INR report
      description: Submit INR value, test date, and optional report attachment.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatientReportUploadRequest"
      responses:
        "200":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientReportSubmitResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /patient/missed-doses:
    get:
      tags: [Patient]
      summary: Get missed dose calculations
      responses:
        "200":
          description: Missed dose calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissedDoseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /patient/dosage-calendar:
    get:
      tags: [Patient]
      summary: Get dosage calendar
      parameters:
        - $ref: "#/components/parameters/MonthsQuery"
        - $ref: "#/components/parameters/StartDateQuery"
      responses:
        "200":
          description: Calendar data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DosageCalendarResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patient/dosage:
    post:
      tags: [Patient]
      summary: Mark dosage as taken
      description: Records a dose only for a scheduled date on or after therapy start and not later than the current clinical date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeDosageRequest"
      responses:
        "200":
          description: Dosage marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TakeDosageResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /patient/health-logs:
    post:
      tags: [Patient]
      summary: Create or replace health log by type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthLogRequest"
      responses:
        "200":
          description: Health log updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /patient/profile-pic:
    post:
      tags: [Patient]
      summary: Upload patient profile picture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProfilePictureUploadRequest"
      responses:
        "200":
          description: Profile picture updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /patient/doctor-updates/summary:
    get:
      tags: [Patient]
      summary: Get doctor update summary
      responses:
        "200":
          description: Doctor update summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorUpdateSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patient/doctor-updates:
    get:
      tags: [Patient]
      summary: List doctor updates
      parameters:
        - $ref: "#/components/parameters/UnreadOnlyQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Doctor updates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorUpdateListResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patient/doctor-updates/read-all:
    patch:
      tags: [Patient]
      summary: Mark all doctor updates as read
      responses:
        "200":
          description: Doctor updates marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkedCountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patient/doctor-updates/{event_id}/read:
    patch:
      tags: [Patient]
      summary: Mark doctor update as read
      parameters:
        - $ref: "#/components/parameters/EventIdPath"
      responses:
        "200":
          description: Doctor update marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /patient/notifications:
    get:
      tags: [Patient]
      summary: List patient notifications
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/IsReadQuery"
      responses:
        "200":
          description: Notification inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patient/notifications/read-all:
    patch:
      tags: [Patient]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkedCountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patient/notifications/{notification_id}/read:
    patch:
      tags: [Patient]
      summary: Mark notification as read
      parameters:
        - $ref: "#/components/parameters/NotificationIdPath"
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /patient/notifications/stream-ticket:
    post:
      tags: [Patient]
      summary: Issue a single-use notification stream ticket
      description: |
        Returns a short-lived (≈30s) single-use ticket bound to the caller's
        current session and security generation. Pass the ticket as `?ticket=`
        when opening the SSE stream from clients that cannot set Authorization.
      responses:
        "200":
          description: Stream ticket issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode: { type: integer, example: 200 }
                  message: { type: string }
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      ticket: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patient/notifications/unread-count:
    get:
      tags: [Patient]
      summary: Count unread patient notifications
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patient/notifications/stream:
    get:
      tags: [Patient]
      summary: Stream patient notifications
      description: |
        Opens a Server-Sent Events connection. Authentication may be supplied with
        a bearer access token (Authorization header) or a single-use `ticket`
        query parameter obtained from POST /patient/notifications/stream-ticket.
        Tickets are single-use, bound to session/security generation, and subject
        to the same hospital and password-policy checks as normal authentication.
      parameters:
        - in: query
          name: ticket
          required: false
          schema:
            type: string
          description: Single-use stream ticket when Authorization header is not used
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: notification
                  data: {"id":"6870...","title":"Doctor update"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Per-user or per-IP stream connection limit exceeded

  /doctors/profile:
    get:
      tags: [Doctor]
      summary: Get doctor profile
      responses:
        "200":
          description: Doctor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Doctor]
      summary: Update doctor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorProfileUpdateRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /doctors/profile-pic:
    post:
      tags: [Doctor]
      summary: Upload doctor profile picture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProfilePictureUploadRequest"
      responses:
        "200":
          description: Profile picture updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /doctors/doctors:
    get:
      tags: [Doctor]
      summary: List doctors
      responses:
        "200":
          description: Doctors retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /doctors/patients:
    get:
      tags: [Doctor]
      summary: List patients assigned to current doctor
      responses:
        "200":
          description: Patients retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorPatientListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Doctor]
      summary: Create patient under current doctor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorCreatePatientRequest"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorPatientCreateResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /doctors/patients/{op_num}:
    get:
      tags: [Doctor]
      summary: Get patient by OP number
      parameters:
        - $ref: "#/components/parameters/OpNumPath"
      responses:
        "200":
          description: Patient retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorPatientDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /doctors/patients/{op_num}/reassign:
    patch:
      tags: [Doctor]
      summary: Reassign patient to another doctor
      parameters:
        - $ref: "#/components/parameters/OpNumPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignPatientRequest"
      responses:
        "200":
          description: Patient reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorPatientDetailResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /doctors/patients/{op_num}/dosage:
    put:
      tags: [Doctor]
      summary: Update weekly dosage
      parameters:
        - $ref: "#/components/parameters/OpNumPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDosageRequest"
      responses:
        "200":
