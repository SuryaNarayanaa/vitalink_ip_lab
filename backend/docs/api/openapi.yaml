        platform.analytics.read: { type: boolean, enum: [true] }
        platform.billing.read: { type: boolean, enum: [true] }
        platform.billing.manage: { type: boolean, enum: [true] }
        platform.system_config.read: { type: boolean, enum: [true] }
        platform.system_config.manage: { type: boolean, enum: [true] }
