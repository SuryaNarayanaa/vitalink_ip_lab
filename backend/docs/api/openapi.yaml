  /statistics/period:
    get:
      x-required-capabilities: [platform.analytics.read, tenant.analytics.read]
      x-admin-scope: either
      x-admin-roles: [app_admin, hospital_admin, auditor]
      tags: [Statistics]
      summary: Get statistics for a date range
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date-time
        - in: query
          name: end_date
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Period statistics retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodStatisticsResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /devices/register:
    post:
      tags: [Devices]
      summary: Register or refresh an FCM device token
      description: |
        Upserts the physical FCM token as the caller's ownership record.

        - A given `fcm_token` has exactly one current owner globally.
        - Re-registering the same physical token under a different authenticated user
          transfers delivery ownership to that user.
        - Other active tokens for the same user and platform are deactivated so only the
          newly registered physical device remains active for that platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegisterRequest"
      responses:
        "201":
          description: Device token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices/{tokenId}:
    delete:
      tags: [Devices]
      summary: Deregister an FCM device token
      description: |
        Deactivates the caller's active device token document. Ownership is enforced by
        matching both the token document id and the authenticated user.
      parameters:
        - $ref: "#/components/parameters/DeviceTokenIdPath"
      responses:
        "200":
          description: Device token deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by `POST /auth/login`. Send as `Authorization: Bearer <token>`.
        Patient routes require PATIENT users and doctor routes require DOCTOR users.
        Admin/statistics routes additionally resolve the current persisted RBAC V2 policy on every request, enforce a namespaced capability and global/tenant scope, and never authorize from mutable JWT permission claims.

  headers:
    XRequestId:
      description: Server-generated or client-forwarded correlation ID
      schema:
        type: string

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Resource identifier
    AdminRoleKeyPath:
      in: path
      name: roleKey
      required: true
      schema:
        $ref: "#/components/schemas/AdminRoleKey"
      description: Fixed administrator role key.
    OpNumPath:
      in: path
      name: op_num
      required: true
      schema:
        type: string
      description: Patient OP number, mapped to the patient user's login_id
    ReportIdPath:
      in: path
      name: report_id
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    NotificationIdPath:
      in: path
      name: notification_id
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    EventIdPath:
      in: path
      name: event_id
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    DeviceTokenIdPath:
      in: path
      name: tokenId
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
      description: DeviceToken document id returned by POST /devices/register
    PageQuery:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IsReadQuery:
      in: query
      name: is_read
      required: false
      schema:
        type: boolean
    UnreadOnlyQuery:
      in: query
      name: unread_only
      required: false
      schema:
        type: boolean
    MonthsQuery:
      in: query
      name: months
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 6
        default: 3
    StartDateQuery:
      in: query
      name: start_date
      required: false
      schema:
        type: string
        pattern: "^[0-9]{2}-[0-9]{2}-[0-9]{4}$"
      description: Date in DD-MM-YYYY format

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not authorized by role, capability, scope, or resource relationship
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Resource no longer available
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RolePolicyConflict:
      description: Role-policy optimistic-concurrency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RolePolicyConflictResponse"
    Locked:
      description: Account locked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LoginRateLimited:
      description: Too many login attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitResponse"
    InsufficientStorage:
      description: File storage provider failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiResponseBase:
      type: object
      required: [statusCode, message, success]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        success:
          type: boolean
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
            - type: "null"

    SimpleSuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logout successful. Please clear the token from client-side.

    MessageOnlyResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: "null"

    DevicePlatform:
      type: string
      enum: [android, ios, web]

    DeviceRegisterRequest:
      type: object
      required: [fcm_token, platform]
      properties:
        fcm_token:
          type: string
          minLength: 1
          description: Physical FCM registration token for this device
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        app_version:
          type: string
          description: Optional client application version string

    DeviceRegisterResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              required: [token_id]
              properties:
                token_id:
                  type: string
                  description: DeviceToken document id for later deregistration

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          example:
            statusCode: 401
            message: Invalid credentials
            data: null
            success: false

    ForbiddenErrorResponse:
      type: object
      required: [success, message]
      properties:
        statusCode:
          type: integer
          enum: [403]
          description: Present when emitted through the common error handler.
        message: { type: string }
        data: { type: "null" }
        success: { type: boolean, enum: [false] }
        required_capability:
          allOf:
            - $ref: "#/components/schemas/AdminCapability"
          description: Safe canonical capability when exactly one capability guards the route.
        required_capabilities:
          type: array
          items: { $ref: "#/components/schemas/AdminCapability" }
          description: Safe alternatives when any one of several capabilities can authorize the route.
        policy_version:
          type: integer
          minimum: 1
          description: Safe persisted policy version used for the denied request, when resolved.
      example:
        statusCode: 403
        message: Administrator role does not have the required capability.
        data: null
        success: false
        required_capability: tenant.patients.assign
        policy_version: 7

    RolePolicyConflictResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [conflict]
          properties:
            conflict:
              type: object
              required: [type, current_policy]
              properties:
                type: { type: string, enum: [role_policy_version_conflict] }
                current_policy:
                  $ref: "#/components/schemas/AdminRolePolicyConflictSnapshot"
      example:
        statusCode: 409
        message: Role policy has changed. Refresh and retry with the current policy version.
        data: null
        success: false
        conflict:
          type: role_policy_version_conflict
          current_policy:
            schema_version: 2
            role_key: auditor
            capabilities:
              platform.hospitals.read: true
              platform.role_policy.read: true
              platform.audit.read: true
              platform.analytics.read: true
              platform.billing.read: true
              platform.system_health.read: true
            protected: false
            policy_version: 9
            updated_by: "687000000000000000000001"
            updated_at: "2026-07-26T10:00:00.000Z"
            change_reason: Quarterly access review

    RateLimitResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Too many requests from this IP, please try again later

    ValidationErrorItem:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    $ref: "#/components/schemas/ValidationErrorItem"

    Pagination:
      type: object
      required: [total, page, limit, pages, hasNext, hasPrev]
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    ApiIndexResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                version:
                  type: string
                  example: v1
                routes:
                  type: array
                  items:
                    type: string

    LoginRequest:
      type: object
      required: [login_id, password]
      properties:
        login_id:
          type: string
          minLength: 1
          example: patient001
        password:
          type: string
          minLength: 1
          format: password

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Opaque refresh token returned by login or refresh.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          minLength: 8
          format: password
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{8,}$"

    PublicHospital:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
        name:
          type: string
        location:
          type: string
        status:
          type: string

    UserProfileRef:
      type: object
      description: Populated role profile. Shape varies by user type.
      additionalProperties: true

    User:
      type: object
      properties:
        _id:
          type: string
        login_id:
          type: string
        user_type:
          type: string
          enum: [ADMIN, DOCTOR, PATIENT]
        profile_id:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/UserProfileRef"
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        password_expired:
          type: boolean
          description: True when the configured password expiry window has elapsed.
        password_changed_at:
          type: [string, "null"]
          format: date-time
        password_expires_at:
          type: [string, "null"]
          format: date-time
        password_policy:
          type: object
          properties:
            expiry_days:
              type: integer
              description: Configured password expiry interval. Zero disables expiry.
            history_count:
              type: integer
              description: Number of previous passwords checked for reuse. Zero disables stored history checks.
        failed_login_attempts:
          type: integer
        locked_until:
          type: [string, "null"]
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time

    SessionPayload:
      type: object
      required: [token, refresh_token, session]
      properties:
        token:
          type: string
          description: Bearer access JWT.
        refresh_token:
          type: string
          description: Opaque refresh token. Store securely on the client; only a hash is stored server-side.
        session:
          type: object
          required: [session_id, refresh_expires_at]
          properties:
            session_id:
              type: string
            refresh_expires_at:
              type: string
              format: date-time

    SessionResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SessionPayload"

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/SessionPayload"
                - type: object
                  required: [user]
                  properties:
                    user:
                      $ref: "#/components/schemas/User"

    VerifyLoginOtpRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          type: string
          description: SMS OTP code from Twilio Verify

    VerifyLoginTotpRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          type: string
          description: 6-digit authenticator-app code

    ActivateAdminTotpRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit code confirming enrollment

    LoginChallengeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              required: [auth_status, challenge]
              properties:
                auth_status:
                  type: string
                  enum: [OTP_REQUIRED, TOTP_REQUIRED]
                challenge:
                  type: object
                  properties:
                    challenge_id:
                      type: string
                    purpose:
                      type: string
                    delivery_channel:
                      type: string
                    factor_type:
                      type: string
                    phone:
                      type: object
                      properties:
                        masked:
                          type: string
                        last4:
                          type: string
                    expires_at:
                      type: string
                      format: date-time
                    resend_available_at:
                      type: string
                      format: date-time
                    attempts_remaining:
                      type: integer
                    max_attempts:
                      type: integer
                    resend_count:
                      type: integer
                    max_resends:
                      type: integer

    AdminTotpSetupResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                otpauth_url:
                  type: string
                secret:
                  type: string
                issuer:
                  type: string
                account_name:
                  type: string

    AdminTotpStatusResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              required: [factor_type, status, enabled]
              properties:
                factor_type:
                  type: string
                  enum: [AUTHENTICATOR_APP]
                status:
                  type: string
                  enum: [ENABLED, PENDING, DISABLED]
                enabled:
                  type: boolean
                enrolled_at:
                  type: [string, "null"]
                  format: date-time
                activated_at:
                  type: [string, "null"]
                  format: date-time
                last_verified_at:
                  type: [string, "null"]
                  format: date-time

    MeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  $ref: "#/components/schemas/User"

    ChangePasswordResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                must_change_password:
                  type: boolean
                password_expired:
                  type: boolean
                password_changed_at:
                  type: [string, "null"]
                  format: date-time
                password_expires_at:
                  type: [string, "null"]
                  format: date-time
                invalidated_sessions:
                  type: integer
                  minimum: 0
                  description: Number of active sessions revoked by the password change.

    DosageSchedule:
      type: object
      properties:
        monday: { type: number, default: 0 }
        tuesday: { type: number, default: 0 }
        wednesday: { type: number, default: 0 }
        thursday: { type: number, default: 0 }
        friday: { type: number, default: 0 }
        saturday: { type: number, default: 0 }
        sunday: { type: number, default: 0 }

    MedicalHistoryItem:
      type: object
      properties:
        diagnosis:
          type: string
        duration_value:
          type: number
        duration_unit:
          type: string
          enum: [Days, Weeks, Months, Years]

    TargetInr:
      type: object
      properties:
        min:
          type: number
        max:
          type: number

    PrimaryPhoneNumber:
      type: string
      pattern: "^[0-9]{10}$"
      minLength: 10
      maxLength: 10
      description: Required primary SMS phone number for doctor and patient login verification.

    PhoneVerificationState:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, VERIFIED]
          default: PENDING
        verified_at:
          type: [string, "null"]
          format: date-time

    NextOfKin:
      type: object
      properties:
        name:
          type: string
        relation:
          type: string
        relationship:
          type: string
        phone:
          type: string

    PatientDemographics:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
          enum: [Male, Female, Other]
        phone:
          $ref: "#/components/schemas/PrimaryPhoneNumber"
        phone_verification:
          allOf:
            - $ref: "#/components/schemas/PhoneVerificationState"
          readOnly: true
        next_of_kin:
          $ref: "#/components/schemas/NextOfKin"

    PatientDemographicsUpdate:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
          enum: [Male, Female, Other]
        phone:
          $ref: "#/components/schemas/PrimaryPhoneNumber"
        next_of_kin:
