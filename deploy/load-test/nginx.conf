worker_processes auto;

events {
  worker_connections 2048;
}

http {
  # Never log query strings: SSE tickets are intentionally carried in the
  # query for browser EventSource compatibility and must not enter artifacts.
  log_format load_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';
  access_log /dev/stdout load_safe;
  error_log /dev/stderr warn;

  server {
    listen 8080;
    client_max_body_size 20m;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "healthy\n";
    }

    location / {
      proxy_pass http://host.docker.internal:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_connect_timeout 10s;
    }
  }
}
