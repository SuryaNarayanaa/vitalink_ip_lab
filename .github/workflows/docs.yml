name: Documentation CI

on:
  push:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "AGENTS.md"
      - "scripts/docs/**"
      - "backend/docs/api/openapi.yaml"
      - "backend/src/app.ts"
      - "backend/src/routes/**"
      - "backend/src/models/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/deploy_web.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "AGENTS.md"
      - "scripts/docs/**"
      - "backend/docs/api/openapi.yaml"
      - "backend/src/app.ts"
      - "backend/src/routes/**"
      - "backend/src/models/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/deploy_web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Install backend contract dependencies
        working-directory: backend
        run: npm ci

      - name: Validate links, route parity, entity parity, and source contracts
        run: python scripts/docs/validate_docs.py

      - name: Lint OpenAPI
        working-directory: backend
        run: npm run lint:openapi

      - name: Extract Mermaid diagrams
        run: python scripts/docs/extract_mermaid.py --output build/mermaid-validation.md

      - name: Install Chrome for Mermaid CLI
        run: npx -y puppeteer browsers install chrome-headless-shell

      - name: Validate Mermaid diagrams
        # GitHub-hosted runners restrict Chromium's user-namespace sandbox.
        # Pass a Puppeteer config so mermaid-cli can render headlessly in CI.
        run: >-
          npx -y @mermaid-js/mermaid-cli
          -p scripts/docs/puppeteer-config.json
          -i build/mermaid-validation.md
          -o build/mermaid-rendered.md

      - name: Validate Structurizr DSL
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/docs/architecture:/usr/local/structurizr"
          structurizr/cli:2025.11.09 validate
          -workspace /usr/local/structurizr/workspace.dsl

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: vitalink-documentation-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 14
