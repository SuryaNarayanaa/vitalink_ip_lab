name: Backend load-test contract

on:
  pull_request:
    paths:
      - "backend/src/**"
      - "backend/docs/api/openapi.yaml"
      - "backend/load-tests/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "deploy/load-test/**"
      - ".github/workflows/backend-load-test.yml"
  workflow_dispatch:
    inputs:
      confirm_non_production:
        description: "Type AUTHORIZED NON-PRODUCTION SMOKE to confirm the protected staging smoke"
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract-verification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate endpoint inventory
        run: npm run load:inventory

      - name: Reject uncommitted inventory drift
        run: git diff --exit-code -- load-tests/generated/endpoints.json

      - name: Verify source, OpenAPI, and inventory reconciliation
        run: npm run load:inventory:verify

      - name: Type-check load-test TypeScript
        run: npm run load:typecheck

      - name: Verify scenario coverage
        run: npm run load:coverage

      - name: Test report merger
        run: npm run load:report:test

      - name: Inspect all k6 scenario modules
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          entries=(
            load-tests/scenarios/public-auth-devices/scenario.js
            load-tests/scenarios/clinical/runner.js
            load-tests/scenarios/admin-platform/runner.js
            load-tests/scenarios/legacy/runner.js
          )
          for entry in "${entries[@]}"; do
            docker run --rm \
              -v "${PWD}:/work" \
              -w /work/backend \
              grafana/k6:2.1.0 \
              inspect --no-color --summary-mode=disabled \
              -e ALLOW_LOAD_TESTS=true \
              -e ALLOW_DESTRUCTIVE_LOAD=true \
              -e LOAD_TEST_RUN_ID=ci_inspect_contract \
              -e LOAD_TEST_PROFILE=smoke \
              -e LOAD_TEST_BASE_URL=http://host.docker.internal:18081 \
              -e LOAD_TEST_ALLOWED_HOSTS=host.docker.internal \
              -e LOAD_TEST_ENV_FINGERPRINT=inspect-only \
              -e LOAD_TEST_CONTEXT_FILE=/work/backend/load-tests/config/inspect-context.json \
              "$entry" >/dev/null
          done

  protected-staging-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: load-test-staging
    concurrency:
      group: vitalink-protected-staging-smoke
      cancel-in-progress: false
    env:
      CONFIRM_NON_PRODUCTION: ${{ inputs.confirm_non_production }}
      LOAD_TEST_EXECUTION_APPROVED: ${{ secrets.LOAD_TEST_EXECUTION_APPROVED }}
      LOAD_TEST_BASE_URL: ${{ secrets.LOAD_TEST_BASE_URL }}
      LOAD_TEST_ALLOWED_HOSTS: ${{ secrets.LOAD_TEST_ALLOWED_HOSTS }}
      LOAD_TEST_ENV_FINGERPRINT: ${{ secrets.LOAD_TEST_ENV_FINGERPRINT }}
      LOAD_TEST_RUN_ID: ${{ secrets.LOAD_TEST_RUN_ID }}
      LOAD_TEST_SCENARIO_CONTEXT_JSON: ${{ secrets.LOAD_TEST_SCENARIO_CONTEXT_JSON }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate protected non-production authorization
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_NON_PRODUCTION" != "AUTHORIZED NON-PRODUCTION SMOKE" ]]; then
            echo "The required non-production confirmation phrase was not supplied." >&2
            exit 1
          fi
          if [[ "$LOAD_TEST_EXECUTION_APPROVED" != "true" ]]; then
            echo "The protected environment has not approved load-test execution." >&2
            exit 1
          fi
          for variable in LOAD_TEST_BASE_URL LOAD_TEST_ALLOWED_HOSTS LOAD_TEST_ENV_FINGERPRINT LOAD_TEST_RUN_ID LOAD_TEST_SCENARIO_CONTEXT_JSON; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Protected environment secret $variable is required." >&2
              exit 1
            fi
          done

      - name: Verify inventory and scenario coverage
        run: |
          npm run load:inventory:verify
          npm run load:coverage

      - name: Run conservative public contract smoke
        shell: bash
        run: |
          set -euo pipefail
          report_dir="load-tests/reports/${LOAD_TEST_RUN_ID}-smoke"
          mkdir -p "$report_dir"
          docker run --rm \
            -v "${PWD}/..:/work" \
            -w /work/backend \
            -e LOAD_TEST_BASE_URL \
            -e LOAD_TEST_ALLOWED_HOSTS \
            -e LOAD_TEST_ENV_FINGERPRINT \
            -e LOAD_TEST_RUN_ID \
            -e LOAD_TEST_SCENARIO_CONTEXT_JSON \
            grafana/k6:2.1.0 \
            run --no-color \
            -e ALLOW_LOAD_TESTS=true \
            -e ALLOW_DESTRUCTIVE_LOAD=true \
            -e LOAD_TEST_PROFILE=smoke \
            -e LOAD_TEST_OPERATION_MODE=auto \
            -e LOAD_TEST_REPORT_DIR=load-tests/reports \
            --out "json=${report_dir}/raw-k6.json" \
            load-tests/scenarios/public-auth-devices/scenario.js

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-staging-smoke-${{ github.run_id }}
          path: backend/load-tests/reports/
          if-no-files-found: error
          retention-days: 14
