name: Deploy Flutter Web and Documentation to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /vitalink_ip_lab/

      - name: Set up Python for documentation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install -r requirements-docs.txt

      - name: Validate documentation source contracts
        working-directory: ${{ github.workspace }}
        run: python scripts/docs/validate_docs.py

      - name: Build documentation into the web artifact
        working-directory: ${{ github.workspace }}
        run: mkdocs build --strict --site-dir frontend/build/web/docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
